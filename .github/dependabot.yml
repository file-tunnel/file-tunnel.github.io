version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # @astrojs/check 0.9.10 supports TypeScript 5 and 6 only.
    ignore:
      - dependency-name: typescript
        versions:
          - ">=7"
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
